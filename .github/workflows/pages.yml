# Publishes tools/dashboard.py's page of the committed verification results with GitHub Pages,
# on every push to main. The page is built from docs/verification-results.json and the oracle
# fixtures alone; nothing is run against Response here. Pages must be set to deploy from
# GitHub Actions (repository Settings > Pages > Source).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the page says whether the results are stale against HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: mkdir -p _site && python tools/dashboard.py --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
