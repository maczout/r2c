[[cause]]
id = "shrink-bond-tolerance"
name = "Shrinkage: transverse bond at the last stage, where the stirrups are in uniform compression"
decision = "D83"
ask = "Accept as a known deviation (D75), or leave transverse bond unassessed on cases without shear?"
suggestion = "Accept as a known deviation, as suggested under D75."
[[cause.match]]
cases = ["newbeam-shrink-m"]
checks = ["view"]
views = ["transverse_average_bond"]
pending = ["D75"]
[[cause.reason]]
basis = "measured"
tool = "tools/viewlines.py on stirrup_stress and transverse_average_bond"
text = "Where the concrete is in compression r2c's stirrup stress is the same at every point; Response's differs a little from point to point. The bond chart is made from the difference between neighbouring points, so Response's shows a few hundredths of a MPa there and r2c's shows none."
[[cause.reason]]
basis = "inferred"
text = "That Response's point-to-point differences are where its own solve for the transverse strain stops (a tolerance), and not a rule r2c lacks. Not tested: it would mean copying that iteration step for step."
[[cause.rule]]
address = "004a8b20"
kernel = "What the concrete's offset does"
[[cause.diagnostic]]
run = "python tools/viewlines.py {fixture:newbeam-shrink-m} {record:newbeam-shrink-m} stirrup_stress --feature ends"
[[cause.diagnostic]]
run = "python tools/viewlines.py {fixture:newbeam-shrink-m} {record:newbeam-shrink-m} transverse_average_bond --feature ends --raw"
[[cause.diagnostic]]
run = "python tools/bond.py {capture:newbeam-shrink-m} {input:newbeam-shrink-m} --stages 46"

[[cause]]
id = "igirder-dropped-stage"
name = "The I-girder with shear: a stage where the top cracks close, which Response does not keep"
decision = "D84"
ask = "Keep accepted (D48, D50, D63), make it part of the named limitation, or take it up again?"
suggestion = "Keep accepted, as its own item beside the named limitation: Response does not repeat itself on this case, so there is no single response to clone."
[[cause.match]]
cases = ["igirder-mv"]
checks = ["shape"]
accepted = ["D48", "D50", "D63"]
[[cause.reason]]
basis = "measured"
tool = "tools/curves.py"
text = "The top of this girder is cracked under no load. Where the cracks close r2c puts stages in between, with the top still cracked, and the load falls back from them by a little over the 2 % the measure counts. Response's curve goes straight through. Before and after it the curves agree."
[[cause.reason]]
basis = "read"
address = "00415e30"
text = "By the stage control as read, Response closes in on such an event with stages put in between, and drops one whose solve fails. So it must have tried a stage there and had it fail; r2c solves the same stage."
[[cause.reason]]
basis = "measured"
tool = "tools/repeat.py"
text = "Response does not repeat itself on this case: five captures gave 15 stages twice and 25 three times, the ten more being stages put in while closing in on the other event (the web cracking). r2c has those ten. At the closing of the top cracks no capture has a stage."
[[cause.reason]]
basis = "inferred"
text = "Why Response's stage fails there was not read to its cause (the node states at the dropped stage were seen in the running program, not explained). Taken to be something not set by the input alone."
[[cause.rule]]
address = "00415e30"
kernel = "**A stage put in between**"
[[cause.diagnostic]]
run = "python tools/curves.py {fixture:igirder-mv} {record:igirder-mv}"
[[cause.diagnostic]]
run = "python tools/repeat.py {archive} {repeats} --only igirder-mv"
[[cause.diagnostic]]
run = "python tools/tries.py {trace:igirder-mv} {fixture:igirder-mv} {input:igirder-mv} --context 6"

