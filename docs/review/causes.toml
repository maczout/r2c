# The causes of the deviations outside target, for the end-of-phase review (docs/review.md).
#
# The developer's file. tools/review.py groups the deviations of the run of record by it and
# builds the "Review" page; tools/evidence.py gathers each cause's evidence. Nothing here
# changes a target, a measure or a decision.
#
# A cause has:
#   id, name            a slug and a plain name (the entry's heading)
#   match               which checks belong to it. The first match in the file takes a check.
#                         cases     case names
#                         checks    "peak", "rising", "post-peak", "shape", "view"
#                         views     view names (for "view"); left out: any view
#                         features  features of Response's curve the stage is at; left out: any
#                         own_state "inside" or "outside": r2c's difference on the view when it
#                                   is put into Response's own state at that stage, as measured
#                                   by tools/evidence.py (docs/review/measured.json)
#                         accepted  the owner's decisions that accepted these checks
#                         pending   decisions put to the owner and not answered
#   reason              the developer's reason, in parts, each marked by what it rests on:
#                         basis = "measured" (a diagnostic, named in `tool`),
#                                 "read" (a rule of the binary, with its `address`),
#                                 "inferred" (an explanation not tested)
#   rule                rules claimed: the binary's address and the heading in docs/kernel.md
#   diagnostic          commands tools/evidence.py runs for the evidence file. Placeholders:
#                         {verify} {archive} {repeats} {fixture:CASE} {capture:CASE}
#                         {record:CASE} {input:CASE} {trace:CASE}
#   ask, suggestion     what the owner is asked now, and the developer's suggestion
#   decision            the number of that question in docs/summary.md
#
# A deviation that no cause matches is shown on the page as "not classified", one entry a
# case, and is never folded into another cause.

# A git ref (a tag) of the run of record at the last review held. Empty: there has been none,
# and "what changed" is counted from the step before the last.
last_review = ""

# ------------------------------------------------------------------ causes on their own

[[cause]]
id = "c2-column"
name = "The circular column under axial load alone, after its peak"
decision = "D78"
ask = "Keep the owner's override (C2), or clone what Response does after the peak?"
suggestion = "Keep the override. It is the owner's ruling that Response looks wrong here; nothing new was learnt in phase A."
[[cause.match]]
cases = ["column-nonly"]
checks = ["post-peak", "view"]
accepted = ["C2", "D12"]
[[cause.reason]]
basis = "measured"
tool = "tools/curves.py, tools/viewmisses.py"
text = "Up to the peak the two curves and every view agree. After it Response leaves the uniform state: its load falls by about a quarter in one step and its views show a curved section under no moment. r2c stays on the uniform state. Every check outside is at that last stage."
[[cause.reason]]
basis = "measured"
tool = "tools/evidence.py (r2c in Response's own state)"
text = "Put into Response's own state at that last stage, r2c gives Response's views (within 0.6 % on all ten). So r2c's rules are not what differs: it is which state each program is in after the peak."
[[cause.reason]]
basis = "inferred"
text = "What makes Response leave the uniform state on this section was not found. On the two rectangular sections under axial load alone it keeps the uniform state to the end, as r2c does. Not cloned by the owner's override; so the difference is by decision, and its origin in the program is unknown."
[[cause.diagnostic]]
run = "python tools/curves.py {fixture:column-nonly} {record:column-nonly} --last 6"
[[cause.diagnostic]]
run = "python tools/curves.py {fixture:newbeam-nonly} {record:newbeam-nonly} --last 4"

[[cause]]
id = "vonly-fall"
name = "Shear alone: a fall of load at cracking that r2c's curve does not show"
decision = "D79"
ask = "Keep accepted (D32, D49), take it up again, or change how the measure reads a fall of load and matches the stage?"
suggestion = "Keep accepted for phase A, and put the measure's reading of stages across cracking on the list for the review of targets that opens phase B (the pattern the owner noted under D49)."
[[cause.match]]
cases = ["newbeam-vonly"]
checks = ["shape"]
accepted = ["D32"]
[[cause.match]]
cases = ["newbeam-vonly"]
checks = ["view"]
features = ["fall"]
accepted = ["D32", "D49"]
[[cause.reason]]
basis = "measured"
tool = "tools/curves.py"
text = "Response's curve falls after cracking by more than the 2 % of the peak from which the measure counts a fall; r2c's curve has no fall the measure counts there. That is the shape."
[[cause.reason]]
basis = "measured"
tool = "tools/sources.py (r2c in Response's own state)"
text = "The 14 views outside are all at Response's one stage after that fall, and every one is inside when r2c is put into Response's own state at it. The measure matches that stage to a stage of r2c's at the same load on the other side of cracking, so cracked views are set against uncracked ones."
[[cause.reason]]
basis = "inferred"
text = "Why r2c's fall at cracking is shallower than Response's was not read. It changed with each change to the shear calculation (1.9 % of the peak, then 1.2 %), which points at the state right after cracking, not at a rule of the stage control."
[[cause.diagnostic]]
run = "python tools/curves.py {fixture:newbeam-vonly} {record:newbeam-vonly}"
[[cause.diagnostic]]
run = "python tools/tries.py {trace:newbeam-vonly} {fixture:newbeam-vonly} --context 6"

[[cause]]
id = "tension-solve"
name = "Axial tension: one rising point fewer before the fall at cracking"
decision = "D80"
ask = "Keep accepted (D36), or finish Response's solve for a stepped axial strain in phase B?"
suggestion = "Keep accepted for phase A; carry the half-built solve into phase B as D36 already says."
[[cause.match]]
cases = ["newbeam-tension"]
checks = ["shape"]
accepted = ["D36"]
[[cause.reason]]
basis = "measured"
tool = "tools/curves.py, tools/branch.py"
text = "Response's curve has one more rising point before the fall at cracking than r2c's, and the measure reads the order of cracking and the fall from that point. Peak and rising branch are inside."
[[cause.reason]]
basis = "read"
address = "004276a0"
text = "Under a stepped axial strain Response uses its general solve, with half steps and a wide tolerance, so its states just before cracking are not balanced; that is where the extra point comes from. Written in r2c and switched off (owner, D36): with it on the shape is Response's, and two Must views at the peak of two cases go outside."
[[cause.rule]]
address = "004276a0"
kernel = "The general solve, under a stepped axial strain"
[[cause.diagnostic]]
run = "python tools/curves.py {fixture:newbeam-tension} {record:newbeam-tension}"
[[cause.diagnostic]]
run = "python tools/branch.py {fixture:newbeam-tension} --stage 11 --points 8"

[[cause]]
id = "tension-diagonal-spacing"
name = "Axial tension: the Diagonal Spacing chart at cracking"
decision = "D81"
ask = "Accept as it is, or one bounded look (one approach)?"
suggestion = "Take up with the tension shape in phase B: the evidence gathered for this review says it is the stage compared, not the chart's rule."
[[cause.match]]
cases = ["newbeam-tension"]
checks = ["view"]
views = ["diagonal_spacing"]
pending = ["D76"]
[[cause.reason]]
basis = "measured"
tool = "tools/evidence.py (r2c in Response's own state), tools/viewlines.py"
text = "Not looked at in phase A; measured for this review. In Response's own state at that stage r2c's chart is Response's (0.0 %). The measure sets Response's stage 12, where the top face has just cracked (the chart shows a spacing over the top 15 mm), against r2c's stage 11, which is not cracked (the chart is empty). So it is the stage compared, not the chart's rule."
[[cause.reason]]
basis = "inferred"
text = "That it goes with the entry on tension's shape (r2c's stage just before cracking sits where Response's first cracked stage does). Not measured with Response's solve for a stepped axial strain switched on."
[[cause.diagnostic]]
run = "python tools/viewlines.py {fixture:newbeam-tension} {record:newbeam-tension} diagonal_spacing --feature cracking --raw"
[[cause.diagnostic]]
run = "python tools/viewlines.py {fixture:newbeam-tension} {record:newbeam-tension} crack_widths --feature cracking --raw"

