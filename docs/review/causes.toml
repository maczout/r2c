checks = ["view"]
views = ["shear_on_crack"]
accepted = ["D61"]
[[cause.reason]]
basis = "read"
address = "00480590"
text = "Response draws the limit of the shear on a crack on one side only when that side's largest value is over a fiftieth of the other's. r2c has the rule."
[[cause.reason]]
basis = "measured"
tool = "tools/sources.py, tools/startfrom.py, tools/viewlines.py"
text = "The chart is 0.15 MPa at most. In r2c's state at the peak the ratio falls on the other side of the fiftieth, so r2c draws a line Response does not, and a line missing counts as 100 %. In Response's own state r2c draws what Response draws. The top of the curve is flat over six stages."
[[cause.reason]]
basis = "inferred"
text = "That the small difference of state is the named limitation (a flat peak reached by other tries) and nothing else."
[[cause.rule]]
address = "00480590"
kernel = "*Shear on Crack*"
[[cause.diagnostic]]
run = "python tools/viewlines.py {fixture:newbeam-tsfactor-mv} {record:newbeam-tsfactor-mv} shear_on_crack --feature peak --raw"
