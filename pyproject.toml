[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Not published to PyPI; install from GitHub.
name = "r2c"
version = "0.1.0"
description = "Sectional response of reinforced concrete: a Python clone of Response-2000's analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
r2c = "r2c.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/r2c"]

[tool.pytest.ini_options]
markers = ["slow: shear cases that take a minute or more (run with -m slow)"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
